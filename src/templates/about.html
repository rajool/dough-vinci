<section class="about page" aria-labelledby="about-title">
  <span class="folio-mark" aria-hidden="true">f. 9r</span>
  <div class="about__top">
    <header class="about__head">
      <p class="kicker-s">The idea</p>
      <h1 id="about-title" class="about__title">{{title}}</h1>
      <div class="about__lines">{{lines}}</div>
    </header>
    <aside class="welcome" aria-labelledby="welcome-title">
      <span class="welcome__tape" aria-hidden="true"></span>
      <h2 class="welcome__k hand" id="welcome-title"><span lang="it">Benvenuti</span> · welcome</h2>
      <div class="welcome__txt">{{welcome}}</div>
      <p class="welcome__sig hand">Dough-Vinci</p>
    </aside>
  </div>
  <ul class="astudies">{{studies}}</ul>
</section>
<div class="pigment" aria-hidden="true"></div>
<section class="drawings page" aria-labelledby="draw-title">
  <header class="sec-head"><p class="kicker-s">From the codex</p><h2 id="draw-title" class="sec-title">The <em>drawings</em></h2></header>
  <ul class="dgrid">
    <li class="dgrid__i dgrid__i--big"><figure><img src="{{root}}assets/art/pizza-study.svg" alt="Coloured pen drawing of a pizza seen from above, inside a circle and a square" width="1000" height="1000" loading="lazy" decoding="async"><figcaption>Fig. 1 · the pizza</figcaption></figure></li>
    <li class="dgrid__i dgrid__i--big"><figure><img src="{{root}}assets/art/burger-study.svg" alt="Coloured pen drawing of a smashburger, layer by layer, with a height scale" width="1000" height="1000" loading="lazy" decoding="async"><figcaption>Fig. 2 · the smashburger</figcaption></figure></li>
    <li class="dgrid__i dgrid__i--wide"><figure><img src="{{root}}assets/art/flying-machine.svg" alt="A flying machine with bat-like wings carrying a pizza box" width="1200" height="700" loading="lazy" decoding="async"><figcaption>Fig. 3 · the delivery machine</figcaption></figure></li>
    <li class="dgrid__i"><figure><img src="{{root}}assets/art/gears.svg" alt="Three wooden gears and a pulley with a weight" width="600" height="300" loading="lazy" decoding="async"><figcaption>Fig. 4 · the works</figcaption></figure></li>
    <li class="dgrid__i"><figure><img src="{{root}}assets/art/map.svg" alt="Round hand-drawn map of Commercial Drive and the blocks around it" width="1000" height="1000" loading="lazy" decoding="async" class="dgrid__map"><figcaption>Fig. 5 · the neighbourhood</figcaption></figure></li>
  </ul>
</section>
<section class="credits page" id="credits" aria-labelledby="credits-title">
  <header class="sec-head"><p class="kicker-s">Thank you</p><h2 id="credits-title" class="sec-title">Photo <em>credits</em></h2></header>
  <p class="credits__lead">Every photo on this site is from <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash<span class="sr"> (opens in a new tab)</span></a>, used under the Unsplash License.</p>
  <ul class="credits__list">{{credits}}</ul>
</section>
